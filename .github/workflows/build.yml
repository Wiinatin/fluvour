name: build
# Builds a signed release APK on every push to main (or by hand: Actions > build > Run workflow)
# and publishes it as a GitHub release named "Fluvour build N". Install it over the old app: no uninstall, no lost progress.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", ".github/workflows/extractor-release.yml", ".github/workflows/voice-packs.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache sherpa-onnx library
        id: sherpa
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-1.13.8.aar
          key: sherpa-onnx-1.13.8
      - name: Download sherpa-onnx library
        if: steps.sherpa.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
      - name: Signing key
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$APP_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret APP_KEYSTORE_PASSWORD is missing. Without it the APK would get a throw-away key and could not update the app. See docs/GITHUB_BUILD.md."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/own.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/own.jks" >> "$GITHUB_ENV"
            echo "Using the keystore from the KEYSTORE_BASE64 secret."
          fi
      - name: Build release APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception" -A3 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Check the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp "$APK" Fluvour-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fluvour build ${{ github.run_number }}
          files: Fluvour-${{ github.run_number }}.apk
          body: Built from ${{ github.sha }}
